# CI de un sitio estático con GitHub Pages (Normas/estandares/17-ci-y-github.md).
# pruebas → main avanza (fast-forward) → se publica ese mismo commit con actions/deploy-pages.
# Pages debe estar en «GitHub Actions» (build_type=workflow) y el entorno github-pages debe aceptar develop.
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pruebas del sitio
        run: python3 -m unittest discover -s .github/tests -v

  promover:
    needs: pruebas
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Repos públicos con ruleset en main: empuja con la deploy key de CI (Normas/ci/blindar-main.sh).
          # Sin el secreto, ssh-key queda vacío y se usa GITHUB_TOKEN como en los privados.
          ssh-key: ${{ secrets.PROMOCION_KEY }}
      - name: main avanza al commit probado (solo fast-forward)
        run: |
          git push origin "${GITHUB_SHA}:refs/heads/main"
          echo "main → ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

  publicar:
    needs: promover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
      - id: despliegue
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
